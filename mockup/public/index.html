<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NowOps — onboarding</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaed;--muted:#9aa4b2;--accent:#5b9dff;--ok:#7ee787;--warn:#e0a458;--bad:#ff7b72}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:1rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid #262b35}
header h1{font-size:1rem;margin:0}
.steps{display:flex;gap:.4rem;margin-left:auto}
.steps span{font-size:.75rem;color:var(--muted);border:1px solid #2b3240;border-radius:999px;padding:.1rem .6rem}
.steps span.on{color:var(--ok);border-color:var(--ok)}
main{max-width:760px;margin:1.2rem auto;padding:0 1rem}
section{background:var(--panel);border:1px solid #262b35;border-radius:10px;padding:1rem;margin-bottom:1rem}
section h2{margin:.1rem 0 .6rem;font-size:1rem}
.muted{color:var(--muted);font-size:.85rem}
button{background:var(--accent);border:0;color:#08121f;font-weight:600;padding:.5rem 1rem;border-radius:8px;cursor:pointer}button[disabled]{opacity:.6;cursor:default}
input{background:#11141a;border:1px solid #2b3240;color:var(--ink);padding:.45rem .6rem;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{padding:.3rem .5rem;border-bottom:1px solid #262b35;text-align:left;vertical-align:top}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.prog{display:flex;flex-direction:column;gap:.25rem;margin:.6rem 0;font-size:.85rem}.prog div::before{content:'· ';color:var(--muted)}.prog div.done::before{content:'✓ ';color:var(--ok)}
code{font-family:Consolas,monospace;font-size:.8em}a{color:var(--accent)}
</style></head><body>
<header><h1>NowOps — onboarding</h1>
<div class="steps" id="steps"><span>1 Sign in</span><span>2 Connect</span><span>3 Dashboard</span></div></header>
<main id="main"></main>
<script type="module">
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild }
const main = document.getElementById('main')
const api = (m, p, b) => fetch(p, { method: m, headers: { 'content-type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then((r) => r.json())
let step = 0
const mark = () => [...document.querySelectorAll('#steps span')].forEach((s, i) => s.classList.toggle('on', i <= step))
const show = (el) => { step++; mark(); main.appendChild(el); el.scrollIntoView({ behavior: 'smooth' }) }

// 1 · Sign in (SSO stands in for a text box)
main.appendChild($(`<section><h2>1 · Sign in</h2><p class="muted">SSO stands in for a text box here. The session resolves to a tenant.</p>
<input id="u" value="sdm@ust.com"> <button id="b1">Sign in with UST SSO</button><div id="o1" class="muted"></div></section>`))
document.getElementById('b1').onclick = async () => {
  const r = await api('POST', '/api/signin', { user: document.getElementById('u').value })
  document.getElementById('o1').textContent = `Signed in as ${r.user} · tenant: ${r.tenant}`
  connect()
}

// 2 · Connect. Connecting reads the instance once: which tables exist, which states are open, which SLA
// definition is P1 resolution. Nothing to confirm; every choice is recorded with its reason and can be
// changed later under Settings. After this the values re-resolve whenever the cache refreshes.
async function connect() {
  const c = await api('GET', '/api/connection')
  show($(`<section><h2>2 · Connect instance</h2><p class="muted">The client's admin enters the instance URL and the service credential once. The credential goes to the secrets store; only a reference is kept. Prefilled here from <code>.env</code>.</p>
  <table><tr><th>Instance URL</th><td>${c.instance_url}</td></tr><tr><th>OAuth client id</th><td>${c.client_id}</td></tr><tr><th>Credential</th><td>${c.credential}</td></tr></table>
  <p><button id="b2">Connect</button></p><div class="prog" id="prog" hidden></div><div id="o2" class="muted"></div></section>`))
  document.getElementById('b2').onclick = async (e) => {
    e.target.disabled = true
    const prog = document.getElementById('prog'); prog.hidden = false
    const line = (t) => { const d = $(`<div>${t}</div>`); prog.appendChild(d); return d }
    const l1 = line('Reading the instance: tables, states, SLA definitions…')
    const profile = await api('POST', '/api/scan'); l1.classList.add('done')
    const present = Object.values(profile.tables).filter((t) => t.present).length, total = Object.keys(profile.tables).length
    l1.textContent = `Instance read · ${present} of ${total} tables NowOps uses are present`
    const l2 = line('Resolving what the definitions need from the instance…')
    const p = await api('POST', '/api/skip-confirm'); l2.classList.add('done')
    const sla = Object.values(profile.sla_matches).filter((m) => m.sure).length, slaAll = Object.keys(profile.sla_matches).length
    l2.textContent = `Open states: ${p.open_states} · SLA definitions matched: ${sla} of ${slaAll}${profile.custom_states.length ? ` · ${profile.custom_states.length} custom state${profile.custom_states.length > 1 ? 's' : ''} counted as open` : ''}`
    const l3 = line('Checking which definitions this instance can answer…')
    const defs = await api('GET', '/api/validate'); l3.classList.add('done')
    const n = defs.filter((d) => d.status === 'available').length
    l3.textContent = `${n} of ${defs.length} definitions available · the rest are hidden with their reason under Settings`
    document.getElementById('o2').innerHTML = `Connected. Opening the dashboard… <a href="/app.html">open now</a>`
    step++; mark()
    setTimeout(() => { location.href = '/app.html' }, 1500)
  }
}
</script></body></html>
