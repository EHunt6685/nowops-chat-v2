}
const controls = (withTable) => `<div class="cc">${withTable ? `<button type="button" class="def t-tbl" title="Table view" aria-label="Table view">${icon('table')}</button>` : ''}<button type="button" class="def t-def" title="How this is measured" aria-label="How this is measured">${icon('help')}</button></div>`
const recipe = (d) => `<div class="recipe">${esc(d.meaning ?? '')}<code>${d.kind === 'ratio' ? esc(d.detail ?? '') + '<br>' + esc(d.filter_resolved ?? '') : `${esc(d.table)} · ${esc(d.aggregate)}${d.field ? `(${esc(d.field)})` : ''} · ${esc(d.filter_resolved || 'no filter')}`}</code>${d.status === 'available' && d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Open these records in ServiceNow ${icon('link')}</a>` : ''}</div>`

function stat(d, span = 2, { sub = '', warn, bad } = {}) {
  if (!d) return ''
  const live = d.status === 'available'
  const v = !live ? (d.status === 'no data yet' ? 'no data yet' : 'not available') : d.kind === 'ratio' ? d.value : fmt(d.value)
  const num = typeof d.value === 'number' ? d.value : parseFloat(d.value)
  const hasT = live && warn != null && isFinite(num), isPct = live && d.kind === 'ratio' && isFinite(num)
  // A timestamp shows its date as the figure and the time underneath; a ServiceNow duration
  // ("2 19:05:11") reads as days and hours; neither wraps onto a second line.
  const raw = String(d.value ?? '')
  const dt = live && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw) ? raw.split(' ') : null
  const dur = live && /^(?:\d+ )?\d{2}:\d{2}:\d{2}$/.test(raw) ? fmtDur(raw) : null

  const tick = firstPaint && live && !dt && !dur && typeof d.value === 'number' && d.kind !== 'ratio'
  const fig = dt ? dt[0] : dur ?? (tick ? `<span data-count="${d.value}">0</span>` : v)
  const line = dt ? `${dt[1]} · ${sub || 'opened'}` : dur ? `${raw} · ${sub || esc(d.meaning ?? '')}` : (sub || esc(d.meaning ?? ''))
  const size = String(tick ? v : fig).length > 11 ? ' sm' : String(tick ? v : fig).length > 8 ? ' md' : ''

  return `<div class="card kpi c${span}${live ? '' : ' off'}">${ktile(d)}<div class="hd"><p class="t one" title="${esc(d.name)}">${esc(shortName(d.name))}</p>${controls(false)}</div>
    <div class="n${size}">${fig}${live && !isPct ? `<span class="dot ${hasT ? dotClass(num, warn, bad) : ''}"></span>` : ''}${hasT ? statePill(num, warn, bad) : ''}${isPct ? ring(num) : ''}</div>

const chart = (title, body, span = 6, note = '', foot = '', tbl = '', sub = '') =>
  `<div class="card c${span}"><div class="hd"><p class="t">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</p>${controls(!!tbl)}</div><div class="plot">${body}${foot}</div>${tbl}<div class="recipe">${note}</div></div>`
// In this concept a section is a panel: sect() opens a new one and later cards land inside it.
let openPanel = () => {}
const sect = (h, p = '') => { openPanel(h, p); return '' }
/** A ratio figure ticks to its value with one decimal. */
function countUpPct(n) {
  const end = Number(n.dataset.countPct); if (!isFinite(end)) return
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { n.textContent = end.toFixed(1); return }
  const t0 = performance.now(), dur = 1500
  const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - (1 - p) ** 3; n.textContent = (end * e).toFixed(1); if (p < 1) requestAnimationFrame(step) }

/** Which icon and tint a KPI tile wears, by the table it counts. Identity, not value. */
const ICON_BY_TABLE = { incident: 'ticket', task_sla: 'sla', change_request: 'change', problem: 'operational', sn_si_incident: 'security', sn_vul_vulnerable_item: 'security', alm_license: 'backlog', kb_knowledge: 'knowledge', kb_use: 'knowledge', asmt_assessment_instance: 'knowledge', metric_instance: 'clock', sysapproval_approver: 'good', cmdb_ci: 'cmdb', cmdb_ci_server: 'cmdb', cmdb_ci_database: 'cmdb', cmdb_rel_ci: 'estate', cmdb_ci_business_app: 'estate', cmdb_ci_appl: 'estate', em_alert: 'warning' }
const TINT_BY_ICON = { ticket: 'var(--t1)', sla: 'var(--tt)', operational: 'var(--t3)', change: 'var(--t2)', security: 'var(--t5)', backlog: 'var(--t4)', knowledge: 'var(--t3)', clock: 'var(--t1)', good: 'var(--t3)', cmdb: 'var(--t4)', estate: 'var(--t4)', warning: 'var(--t2)', overview: 'var(--tt)' }
const iconFor = (d) => ICON_BY_TABLE[d.table] ?? (d.kind === 'ratio' ? 'sla' : 'overview')
const ktile = (d) => `<span class="ktile" style="background:${TINT_BY_ICON[iconFor(d)] ?? 'var(--tt)'}">${icon(iconFor(d))}</span>`

/** One breakdown query, rendered in whichever form suits the data's shape:
    donut (part-to-whole, few slices), lolli (ranked, close values), tree (long tail with a head),
    vbars (a handful of ordered classes), share (one bar plus key),
    table (names that matter as much as the numbers), hbars (the plain ranked bar). */
async function bd(kind, title, table, q, by, { span = 6, top = 8, fmtv = fmt, sub = '' } = {}) {
  const b = await api(`/api/breakdown?table=${table}&by=${by}&top=${top}&q=${encodeURIComponent(q)}`)
  // Two raw values can share a display label (a blank reference and a group literally named
  // "Unassigned"); they are one row to a reader, so merge them.
  const merged = new Map()
  for (const r of b.rows ?? []) { const k = label(r.k); const m = merged.get(k); if (m) m.v += r.v; else merged.set(k, { k, v: r.v, raw: r.raw }) }
  const rows = [...merged.values()].sort((a, c) => (/^Other \(/.test(a.k) ? 1 : 0) - (/^Other \(/.test(c.k) ? 1 : 0) || c.v - a.v).map((r) => ({ ...r, tip: `${esc(r.k)}: ${fmt(r.v)}<code>${esc(b.q ? b.q + '^' : '')}${by}=${esc(r.raw)}</code>` }))
  const note = `<code>${esc(table)}</code> where <code>${esc(b.q || 'no filter')}</code>, counted by <code>${esc(by)}</code>. Top ${top}, rest folded into Other.`
  if (!rows.length) return chart(title, '<p class="sub">No records match.</p>', span, note, '', '', sub)
  const tbl = dtable([by, 'count'], rows.map((r) => [esc(r.k), fmtv(r.v)]))
  // One class holding everything is a fact, not a chart: state it as a figure.
  if (rows.filter((r) => !/^Other \(/.test(r.k)).length === 1) { const r = rows[0]; return chart(title, `<div class="n mono" style="font-size:26px;font-weight:600;margin-top:4px">${fmt(r.v)}</div><div class="sub" style="margin-top:6px">all in <b style="color:var(--ink);font-weight:500">${esc(r.k)}</b>; no other ${esc(by.replace(/_/g, ' ').replace(/^.*\./, ''))} recorded</div>`, span, note, '', tbl, sub) }
  const isOther = (r) => /^Other \(/.test(r.k)
  const coloured = rows.map((r, i) => ({ ...r, k: r.k.replace(/^\d+\s*-\s*/, ''), c: isOther(r) ? 'var(--mark2)' : CAT[i] ?? 'var(--mark2)' }))
  if (kind === 'table') return `<div class="card c${span}"><div class="hd"><p class="t">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</p>${controls(false)}</div><div class="tscroll">${barTable(rows.filter((r) => !isOther(r)), by)}</div><div class="recipe">${note}</div></div>`
  // Draw at the width the card will actually have, so text stays at its real size when scaled.
  const w = span <= 4 ? 320 : span <= 6 ? 560 : 760, narrow = w < 400
  // The folded "Other" row is a table fact, not a mark to rank: it would dwarf every real row.
  const ranked = rows.filter((r) => !isOther(r))
  // Ordered classes (priority, risk) read left to right in their own order, not by count.
  const ordered = ranked.every((r) => /^\d/.test(String(r.raw))) ? [...ranked].sort((a, b) => parseInt(a.raw) - parseInt(b.raw)) : ranked
  const body = kind === 'donut' ? donut(coloured.slice(0, 6)) : kind === 'lolli' ? lolli(ranked, { fmtv, w, lw: narrow ? 96 : 130 }) : kind === 'tree' ? treemap(rows, { w, h: narrow ? 220 : 250 })
    : kind === 'vbars' ? vbars(ordered.map((r) => ({ k: trunc(r.k.replace(/^\d+\s*-\s*/, ''), narrow ? 8 : 12), v: r.v, tip: r.tip })), { w, h: narrow ? 180 : 200, fmtv })
    : kind === 'share' ? share(coloured) : hbars(ranked, { fmtv, w, lw: narrow ? 96 : 120 })
  return chart(title, body, span, note, '', tbl, sub)
}
const breakdown = (title, table, q, by, o) => bd('hbars', title, table, q, by, o)
async function shareCard(title, table, q, by, { span = 4, keys, colors } = {}) {
  const b = await api(`/api/breakdown?table=${table}&by=${by}&top=${keys.length}&q=${encodeURIComponent(q)}`)
  // "1 - Critical" from ServiceNow reads as "Critical" in the key; the tooltip keeps the full form.
  const items = keys.map((k, i) => ({ k: k.replace(/^\d+\s*-\s*/, ''), v: (b.rows ?? []).find((r) => r.k === k || r.raw === String(i + 1))?.v ?? 0, c: colors[i] }))
  return chart(title, share(items), span, `<code>${esc(table)}</code> where <code>${esc(b.q || 'no filter')}</code>, counted by <code>${esc(by)}</code>.`, '', dtable([by, 'count'], items.map((i) => [esc(i.k), fmt(i.v)])))
}
async function tableCard(title, table, q, by, { span = 4, top = 6, sub = '' } = {}) {

  const rows = (b.rows ?? []).filter((r) => !/^Other/.test(r.k)), total = rows.reduce((a, r) => a + r.v, 0) || 1
  return `<div class="card c${span}"><div class="hd"><p class="t">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</p>${controls(false)}</div>
    <div class="tscroll"><table class="tbl"><tr><th>${esc(by.replace(/_/g, ' '))}</th><th>count</th><th>share</th></tr>${rows.map((r) => `<tr><td><i></i>${esc(label(r.k))}</td><td>${fmt(r.v)}</td><td>${(100 * r.v / total).toFixed(0)}%</td></tr>`).join('')}</table></div>
    <div class="recipe"><code>${esc(table)}</code> where <code>${esc(b.q || 'no filter')}</code>, counted by <code>${esc(by)}</code>.</div></div>`
}
async function stackedBreakdown(title, table, q, by, keys, colors, { span = 6, top = 10, note = '' } = {}) {
  const b = await api(`/api/breakdown?table=${table}&by=${by}&top=200&q=${encodeURIComponent(q)}`)
  const rows = {}
  for (const r of b.rows ?? []) { if (!r.keys || r.keys.length < 2) continue; const seg = r.keys.find((k) => keys.includes(k)) ?? r.keys[1]; const row = r.keys.find((k) => k !== seg) ?? r.keys[0]; rows[row] ??= { bucket: row.length > 22 ? row.slice(0, 21) + '…' : row, q: `${b.q ? b.q + '^' : ''}${by.split(',')[0]}=${r.raw}` }; rows[row][seg] = (rows[row][seg] ?? 0) + r.v }

}
async function listTable(title, table, fields, labels, order, { span = 12, limit = 10 } = {}) {
  const r = await api(`/api/list?table=${table}&fields=${fields.join(',')}&order=${order}&limit=${limit}`)
  // Identical rows collapse into one with a count. The join uses a separator no field contains.
  const SEP = '\u001f', seen = new Map()
  for (const row of r.rows ?? []) { const k = fields.map((f) => row[f] ?? '').join(SEP); seen.set(k, (seen.get(k) ?? 0) + 1) }
  const body = [...seen].map(([k, n]) => `<tr>${k.split(SEP).map((v, i) => `<td>${i === 0 ? '<i></i>' : ''}${esc(v)}</td>`).join('')}<td class="sub">${n > 1 ? `${n} records` : ''}</td></tr>`).join('')

}
/** This instance holds bulk-loaded demo data, so some months are near-empty. Say so on the chart. */
function thinMonths(months, key = 'opened') {
  const vals = months.map((m) => m[key] ?? 0).filter((v) => v > 0).sort((a, b) => a - b)
  if (vals.length < 3) return []
  const mid = vals[Math.floor(vals.length / 2)]

}

  const line = (x, i) => x.ok
    ? `<li class="ok"><span class="lbl">${esc(x.label)} <b>${esc(x.current)}</b></span></li>`

    <div class="body checksbody"><div class="score" style="--mark:${gaps.length ? 'var(--warn-ink)' : 'var(--acc)'}">${ring(pct, 84, 7)}<div class="sv"><b>${ok}</b><small>of ${cs.length}</small></div><span class="sl">in place</span></div><ul class="checks">${cs.map(line).join('')}</ul></div></div>`

/** Which Agents button owns the open panel; a second press on it closes the panel. */
function setAgentOn(key) {

}

/** One or all proposed fixes become a single confirmed write of only those fields. */
function applyFix(which) {
  const c = R.cur; if (!c) return
  const list = which === 'all' ? (c.checks || []).filter((x) => !x.ok && x.fix) : [c.checks[Number(which)]].filter((x) => x?.fix)
  if (!list.length) return
  const fields = {}, rows = []
  for (const x of list) { Object.assign(fields, x.fix.fields); rows.push([x.label, x.current, x.fix.value, x.fix.evidence]) }
  confirmAction('fields', { fields, rows })

// ---- Writes: every one goes through /api/resolve/write and reports what happened.
async function write(action, payload) {
  try {
    const r = await apiJ('POST', '/api/resolve/write', { number: R.ticket, action, payload, as: who() })
    toast((r.dryRun ? 'Dry run, nothing written. Would have set: ' : 'Written to the instance: ') + Object.keys(r.body).join(', ') + ' on ' + (r.number || R.ticket))

    return r

}

const closeConfirm = () => id_('ov').classList.remove('on')
const PAYLOAD = {

  hold: () => ({ reason: id_('cf-reason').value, note: id_('cf-wn').value }), reassign: () => (R.arg?.group ? { group: R.arg.group } : { user: R.arg?.person }),
  comment_hold: () => ({ text: id_('cf-c').value }), kb_draft: () => ({ title: id_('cf-t').value, text: id_('cf-b').value }), problem: () => ({ title: id_('cf-t').value, text: id_('cf-b').value }),

  if (a === 'who') return localAnswer('Who fixed this before?', c?.who.length ? c.who.map((w) => `<b>${esc(w.name)}</b> (${esc(w.kind)}) closed ${w.n}: ${esc(w.tickets.join(', '))}`).join('<br>') : 'Nobody on this instance has closed a similar ticket with a usable close note.')

/** The teal line under the current page slides to wherever that page's tab is. */
function placeInd() {
  const on = document.querySelector('#nav a.on'), ind = id_('navind'); if (!on || !ind) return
  ind.style.left = on.offsetLeft + 8 + 'px'; ind.style.width = Math.max(0, on.offsetWidth - 16) + 'px'
}
addEventListener('resize', placeInd)
// Hovering a slice, a bar segment or a key row lights that one and dims the rest of its chart.
id_('page').addEventListener('mouseover', (e) => {
  const el = e.target.closest('[data-k]'), box = el?.closest('.sync'); if (!box) return
  box.querySelectorAll('[data-k]').forEach((n) => { const same = n.dataset.k === el.dataset.k; n.classList.toggle('hk', same); n.classList.toggle('dim', !same) })
})
id_('page').addEventListener('mouseout', (e) => { const box = e.target.closest('.sync'); if (box && !box.contains(e.relatedTarget)) box.querySelectorAll('[data-k]').forEach((n) => n.classList.remove('hk', 'dim')) })

async function render() {
  if (!cache) await load()
  // Two surfaces share the frame. #resolve… hashes belong to Resolve; everything else is the dashboard.
  const hash = location.hash.slice(1), isRes = hash.startsWith('resolve')
  paintNav(isRes ? 'resolve' : 'dash')
  document.body.classList.toggle('resolve', isRes)
  document.body.classList.toggle('ticket', isRes && /^resolve\/INC/i.test(hash))
  document.querySelectorAll('#mode a').forEach((a) => a.classList.toggle('on', (a.dataset.m === 'resolve') === isRes))
  id_('page').hidden = id_('foot').hidden = isRes; id_('resolve').hidden = !isRes
  if (isRes) { await renderResolve(hash); return }
  R.view = 'dash'; R.ticket = null; R.cur = null; setAvatar(); paintCtx()
  const { rows, s, d } = cache
  const page = (location.hash.slice(1).split('&')[0] || 'overview'); const meta = PAGES[page] ?? PAGES.overview
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.p === page))
  id_('title').textContent = meta.title; id_('lede').textContent = meta.lede
  const g = id_('page'); g.innerHTML = ''; let grid = null
  // The first group on a page has no heading: the top bar already names the page. Later groups
  // carry a small eyebrow label.
  openPanel = (h, p = '', link = '') => {
    const sec = el(`<section class="panel">${h ? `<div class="ph"><h2>${esc(h)}</h2><p>${esc(p)}</p><div class="pr">${link ? `<a class="ibtn" href="#${link}" title="Open ${esc(h)}">${icon('ext')}</a>` : ''}</div></div>` : ''}<div class="grid"></div></section>`)
    g.appendChild(sec); grid = sec.querySelector('.grid')
  }
  openPanel('')
  const add = (h) => { if (h) grid.insertAdjacentHTML('beforeend', h) }
  const addAll = async (...ps) => add((await Promise.all(ps)).join(''))
  const att = d.sla_attainment, attPct = att?.status === 'available' ? parseFloat(att.value) : null
  const pct = (v) => v == null ? '—' : v.toFixed(1) + '%'
  const thinO = thinMonths(s.months, 'opened'), thinM = thinMonths(s.months, 'met')
  const cur = s.months[s.months.length - 1], prev = s.months[s.months.length - 2]

  const gaugeCard = () => `<div class="card c3"><div class="hd"><p class="t one" title="SLA attainment, resolution, all incidents">SLA attainment<small>resolution, all incidents</small></p>${controls(false)}</div>
    <div class="gauge">${gauge(attPct)}<div class="gv">${attPct == null ? '—' : attPct.toFixed(1)}%</div><div class="gl">of incident SLAs met · target 80%</div>${attPct == null ? '' : attPct >= 80 ? pill('up', 'On target') : attPct >= 70 ? pill('warn', 'Below target') : pill('down', 'Well below target')}
    <div class="gf"><span>Met</span><b>${esc((att?.detail ?? '').split('÷')[0].trim())}</b><span>Completed</span><b>${esc((att?.detail ?? '').split('÷')[1]?.trim() ?? '')}</b></div></div>
    <div class="recipe">${esc(att?.meaning ?? '')}<code>${esc(att?.filter_resolved)}</code></div></div>`

  const attByPriority = (span = 4, h = 176) => chart('Attainment by priority', vbars(s.attainment.map((a) => ({ k: a.priority, v: a.pct ?? 0, tip: `${a.priority}: ${fmt(a.met)} of ${fmt(a.all)} met<code>${esc(a.q)}</code>` })), { target: 80, fmtv: pct, max: 100, h }), span,
    'Completed incident resolution SLAs not breached, divided by all completed, per priority. Teal meets the 80% target.', '',
    dtable(['Priority', 'Met', 'Completed', 'Attainment'], s.attainment.map((a) => [a.priority, fmt(a.met), fmt(a.all), pct(a.pct)])), 'teal meets the 80% target')

  const flowCard = (span = 8) => `<div class="card c${span}"><div class="hd"><p class="t">Opened vs resolved<small>incidents per calendar month, six months</small></p>${controls(true)}</div>
    <div class="plot"><div class="heads"><div><small><i style="background:var(--mark)"></i>Opened, ${esc(cur.label)}</small><b>${fmt(cur.opened)}${deltaPill(cur.opened, prev?.opened, thinO, prev?.label)}</b></div><div><small><i style="background:var(--mark2)"></i>Resolved, ${esc(cur.label)}</small><b>${fmt(cur.resolved)}${deltaPill(cur.resolved, prev?.resolved, thinO, prev?.label)}</b></div></div>
    ${lines(s.months, [{ k: 'opened', n: 'opened', q: 'opened_q' }, { k: 'resolved', n: 'resolved', q: 'resolved_q' }], { w: span >= 12 ? 1120 : 700, h: span >= 12 ? 240 : 210 })}${gapNote(thinO)}</div>
    ${dtable(['Month', 'Opened', 'Resolved'], s.months.map((m) => [m.label, fmt(m.opened), fmt(m.resolved)]))}
    <div class="recipe">Incidents by <code>opened_at</code> and <code>resolved_at</code>. The month-over-month pill is withheld when the previous month is one of the sparse ones.</div></div>`

  const agingChart = (span = 6) => chart('Open incidents by age and priority', heat(P, s.aging.map((a) => a.bucket), (p, b) => s.aging.find((a) => a.bucket === b)?.[p] ?? 0, {
      tipOf: (p, b, v) => { const row = s.aging.find((a) => a.bucket === b); return `${p} · ${esc(b)}: ${fmt(v)}<code>${esc(row?.q ?? '')}^priority=${p.slice(1)}</code>` } }), span,
    'Open incidents bucketed on <code>opened_at</code>, split by priority. Shade is binned on a log scale because the counts span 2 to 4,095; every cell also carries its exact number.',
    rampLegend('fewer', 'more'), dtable(['Priority', ...s.aging.map((a) => a.bucket)], P.map((p) => [p, ...s.aging.map((a) => fmt(a[p] ?? 0))])), 'darker cells hold more tickets')

  const mttrChart = (span = 6) => chart('Mean time to resolve', lolli(s.mttr.map((m) => ({ k: m.priority, v: m.hours, tip: `${m.priority}: ${m.raw} over ${fmt(m.n)} incidents<code>${esc(m.q)}</code>` })), { fmtv: hrs, lw: 40, hi: -1 }), span,
    'Average <code>calendar_duration</code> on resolved or closed incidents, one window for every priority.',
    `<div class="note">${icon('warning')}<span>P1 is skewed by incidents opened in 2015 to 2018 and closed years later. Read it as a data-quality signal, not a service level.</span></div>`,
    dtable(['Priority', 'Mean time', 'Incidents'], s.mttr.map((m) => [m.priority, hrs(m.hours), fmt(m.n)])), 'by priority')

  const slaTrend = (span = 6) => chart('SLAs met vs breached', lines(s.months, [{ k: 'met', n: 'met' }, { k: 'breached', n: 'breached' }], { w: 560 }), span,
    'Completed incident resolution SLAs by created month.', legend([['Met', 'var(--mark)'], ['Breached', 'var(--mark2)']]) + gapNote(thinM),
    dtable(['Month', 'Met', 'Breached'], s.months.map((m) => [m.label, fmt(m.met), fmt(m.breached)])), 'per calendar month')

  if (page === 'overview') {
    // Hero: the greeting and the one number the service is judged on, on the brand's dark teal,
    // with the four figures a delivery manager reaches for next beside it.
    const met = (att?.detail ?? '').split('÷').map((x) => x.trim())
    const quick = [['Open tickets', d.open_incidents], ['Major incidents', d.active_major], ['SLAs at risk', d.approaching_breach], ['Due in 72 h', d.due_72h]]
    add(`<div class="hero2"><div><div class="hi">${esc(dayGreeting())}, ${esc(USER.name)}.</div><div class="ht">SLA attainment · resolution</div>
      <div class="hfig">${attPct == null ? '—' : `<span data-count-pct="${attPct}">${firstPaint ? '0.0' : attPct.toFixed(1)}</span>`}<small>%</small></div>
      <div class="hmeter"><i style="width:${Math.max(0, Math.min(100, attPct ?? 0))}%"></i><b style="left:80%" title="target 80%"></b></div>
      <div class="hsub">${esc(met[0] ?? '')} met of ${esc(met[1] ?? '')} completed · target 80% · ${attPct == null ? '' : attPct >= 80 ? 'on target' : 'below target'}</div></div>
      <div class="hr">${quick.map(([n, x], j) => `<div style="--j:${j}"><span>${esc(n)}</span><b>${x?.status === 'available' ? (firstPaint && typeof x.value === 'number' ? `<span data-count="${x.value}">0</span>` : fmt(x.value)) : '—'}</b></div>`).join('')}</div></div>`)
    add(`<div class="c4 grid" style="align-content:stretch">${stat(d.active_major, 12, { warn: 20, bad: 50 }) + stat(d.approaching_breach, 12, { warn: 50, bad: 200 })}</div>`)
    add(flowCard(8) + attByPriority(4, 236))
    await addAll(bd('donut', 'Open incidents by priority', 'incident', 'stateIN{{open_states}}', 'priority', { span: 4, top: 5 }),
      bd('table', 'Open incidents by support group', 'incident', 'stateIN{{open_states}}', 'assignment_group', { span: 5, top: 6, sub: 'top groups, with their share of open work' }))
    add(`<div class="c3 grid" style="align-content:stretch">${stat(d.open_changes, 12) + stat(d.open_problems, 12)}</div>`)
    add(sect('Explore', 'Each area holds its full set of measures and charts. Scroll sideways.'))
    add(`<div class="strip">${NAV.filter(([id]) => id !== 'overview').map(([id, n]) => `<a class="card gcard" href="#${id}"><span class="gi">${icon(id)}</span><span><b>${esc(n)}</b><span class="d">${esc(PAGES[id]?.lede ?? '').split('.')[0]}.</span></span><span class="go">Open ${icon('go')}</span></a>`).join('')}</div>`)
  }
  if (page === 'operational') {
    add(stat(d.open_incidents, 2) + stat(d.open_p1, 2, { warn: 5, bad: 15 }) + stat(d.active_major, 2, { warn: 20, bad: 50 }) + stat(d.on_hold, 2) + stat(d.open_changes, 2) + stat(d.open_problems, 2))
    add(sect('Where the open incidents are'))
    await addAll(bd('donut', 'Open incidents by priority', 'incident', 'stateIN{{open_states}}', 'priority', { span: 4, top: 5 }),
      bd('tree', 'Open incidents by support group', 'incident', 'stateIN{{open_states}}', 'assignment_group', { span: 8, top: 9, sub: 'area is the count; the largest group is highlighted' }))
    await addAll(bd('share', 'Open incidents by state', 'incident', 'stateIN{{open_states}}', 'state', { span: 5, top: 6 }),
      bd('lolli', 'Open incidents by location', 'incident', 'stateIN{{open_states}}^locationISNOTEMPTY', 'location', { span: 7, top: 9 }))
    add(sect('Requests, changes, problems'))
    await addAll(bd('vbars', 'Requests by state', 'sc_request', '', 'state', { span: 6, top: 6 }), bd('donut', 'Problems by state', 'problem', '', 'state', { span: 6, top: 6 }))
  }
  if (page === 'sla') {
    add(gaugeCard() + attByPriority(4) + `<div class="c5 grid" style="align-content:start">${stat(d.sla_breached, 6) + stat(d.approaching_breach, 6, { warn: 50, bad: 200 }) + stat(d.due_72h, 6, { sub: 'unbreached, planned end within 72 hours' }) + stat(d.sla_p1_attainment, 6, { sub: 'P1 met ÷ P1 completed' })}</div>`)
    add(sect('Trend and where breaches land'))
    add(slaTrend(7))
    await addAll(bd('tree', 'Breached SLAs by support group', 'task_sla', 'has_breached=true^task.sys_class_name=incident', 'task.assignment_group', { span: 5, top: 8, sub: 'area is the breach count' }))
    await addAll(bd('donut', 'SLA stage, all incident SLAs', 'task_sla', 'task.sys_class_name=incident', 'stage', { span: 6, top: 6 }),
      bd('vbars', 'Breached SLAs by priority', 'task_sla', 'has_breached=true^task.sys_class_name=incident', 'task.priority', { span: 6, top: 5 }))
  }
  if (page === 'backlog') {
    add(stat(d.backlog, 2, { sub: 'in progress, assigned, P2 to P4' }) + stat(d.aged_90, 2, { warn: 500, bad: 2000 }) + stat(d.oldest_open_p1, 2, { sub: 'opened' }) + stat(d.reassignment_rate, 2, { sub: d.reassignment_rate?.detail ?? '' }) + stat(d.mtta, 2, { sub: 'ServiceNow metric' }) + stat(d.time_in_state, 2, { sub: 'any single state' }))
    add(sect('Flow and age'))
    add(flowCard(12))
    add(agingChart(7) + mttrChart(5))
    add(sect('Where the load sits'))
    await addAll(bd('table', 'Open incidents by assignee', 'incident', 'stateIN{{open_states}}^assigned_toISNOTEMPTY', 'assigned_to', { span: 6, top: 8, sub: 'automation accounts included' }),
      bd('lolli', 'Open incidents by support group', 'incident', 'stateIN{{open_states}}', 'assignment_group', { span: 6, top: 8 }))
  }
  if (page === 'change') {
    add(stat(d.change_success_rate, 3, { sub: `${d.change_success_rate?.detail ?? ''} with a close code` }) + stat(d.emergency_change_pct, 3, { sub: d.emergency_change_pct?.detail ?? '' }) + stat(d.approvals_pending, 3) + stat(d.approval_time, 3, { sub: 'ServiceNow metric' }))
    add(sect('Change mix and outcomes'))
    await addAll(bd('donut', 'Changes by type', 'change_request', '', 'type', { span: 4, top: 5 }),
      bd('share', 'Changes by close code', 'change_request', 'close_codeISNOTEMPTY', 'close_code', { span: 4, top: 4, sub: 'of the 16 changes that recorded an outcome' }),
      bd('vbars', 'Open changes by priority', 'change_request', 'active=true', 'priority', { span: 4, top: 5 }))
    await addAll(bd('lolli', 'Approvals by state', 'sysapproval_approver', '', 'state', { span: 6, top: 6 }), bd('share', 'Changes by state', 'change_request', '', 'state', { span: 6, top: 5 }))
  }
  if (page === 'security') {
    add(stat(d.security_open, 3) + stat(d.vulnerable_items, 3) + stat(d.critical_vulns, 3) + stat(d.reopened, 3))
    add(sect('Open security incidents'))
    await addAll(bd('donut', 'By priority', 'sn_si_incident', 'active=true', 'priority', { span: 4, top: 5 }), bd('table', 'By assignment group', 'sn_si_incident', 'active=true', 'assignment_group', { span: 8, top: 7 }))
    await addAll(bd('lolli', 'By location', 'sn_si_incident', 'active=true^locationISNOTEMPTY', 'location', { span: 6, top: 8 }), bd('vbars', 'Vulnerable items by risk rating', 'sn_vul_vulnerable_item', 'active=true', 'risk_rating', { span: 6, top: 6 }))
  }
  if (page === 'cmdb') {
    add(stat(d.servers, 2) + stat(d.databases, 2) + stat(d.warranty_expired, 2, { warn: 20, bad: 60 }) + stat(d.entitlements_in_use, 2) + stat(d.perpetual_licences, 2) + stat(d.alerts_active, 2))
    add(sect('Inventory'))
    await addAll(bd('tree', 'CIs by class', 'cmdb_ci', '', 'sys_class_name', { span: 7, top: 11, sub: 'area is the count; the largest class is highlighted' }), bd('donut', 'Servers by class', 'cmdb_ci_server', '', 'sys_class_name', { span: 5, top: 5 }))
    await addAll(bd('lolli', 'CIs by location', 'cmdb_ci', 'locationISNOTEMPTY', 'location', { span: 7, top: 8 }), bd('donut', 'Entitlements by acquisition', 'alm_license', '', 'acquisition_method', { span: 5, top: 5 }))
  }
  if (page === 'estate') {
    const services = await api('/api/services')
    const sel = location.hash.split('=')[1] || services.find((x) => /SAP Enterprise/.test(x.name))?.id || services[0]?.id
    add(`<div class="card c12"><div class="hd"><p class="t">Application</p></div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><select id="svc" class="sel">${services.map((x) => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}${x.criticality ? ' · ' + esc(x.criticality) : ''}</option>`).join('')}</select><span class="sub">${services.length} business services on this instance. Ticket tiles need tickets linked to the service; on this instance 9 of 36,038 incidents are.</span></div></div>`)
    if (sel) {
      const a = await api(`/api/app?service=${sel}`); const c = a.counts
      const t = (label, k) => `<div class="card kpi c2"><div class="hd"><p class="t">${esc(label)}</p>${controls(false)}</div><div class="n">${fmt(c[k].value)}<span class="dot mute"></span></div><div class="recipe"><code>${esc(c[k].table)} · ${esc(c[k].filter)}</code><a href="${esc(c[k].url)}" target="_blank" rel="noopener">Open these records in ServiceNow ${icon('link')}</a></div></div>`
      add(t('Incidents, all time', 'incidents_all') + t('Open incidents', 'incidents_open') + t('Open P1/P2', 'incidents_p1p2_open') + t('Changes on this CI', 'changes') + t('Problems', 'problems') + t('SLA breaches', 'sla_breached'))
    }
    add(sect('IT configuration', 'Counted directly from the CMDB; the house tile counts relationships, shown beside it.'))
    add(stat(d.applications, 2) + stat(d.business_apps, 2) + stat(d.servers, 2) + stat(d.servers_related, 2, { sub: 'house number' }) + stat(d.databases, 2) + stat(d.ci_relationships, 2))
    await addAll(bd('donut', 'Servers by class', 'cmdb_ci_server', '', 'sys_class_name', { span: 5, top: 5 }), bd('tree', 'CIs by class', 'cmdb_ci', '', 'sys_class_name', { span: 7, top: 11, sub: 'area is the count' }))
    add(sect('Unified software view', 'Software entitlements from Software Asset Management.'))
    add(stat(d.entitlements_total, 2) + stat(d.entitlements_in_use, 2) + stat(d.entitlements_in_stock, 2) + stat(d.perpetual_licences, 2))
    await addAll(bd('share', 'In use vs in stock', 'alm_license', '', 'install_status', { span: 4, top: 3 }))
    await addAll(stackedBreakdown('Software entitlement by state, per product', 'alm_license', '', 'model.display_name,install_status', ['In use', 'In stock'], ['var(--mark)', 'var(--mark2)'], { top: 12, note: 'Entitlements grouped by software product model and install status.' }), stackedBreakdown('Entitlements by vendor and acquisition', 'alm_license', '', 'model.manufacturer,acquisition_method', ['Purchase', 'Lease', 'Rental', 'Device as a Service', 'Loan'], ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--mark2)'], { top: 8, note: 'Vendor by acquisition method.' }))
    await addAll(listTable('Top entitlements by cost', 'alm_license', ['display_name', 'install_status', 'rights', 'cost'], ['Entitlement', 'State', 'Rights', 'Cost'], '-cost', { limit: 10 }))
    add(sect('Security', 'Shown only where Security Operations is installed.'))
    add(stat(d.security_open, 3) + stat(d.vulnerable_items, 3) + stat(d.critical_vulns, 3) + stat(d.alerts_active, 3))
    await addAll(bd('donut', 'Open security incidents by priority', 'sn_si_incident', 'active=true', 'priority', { span: 4, top: 5 }), bd('table', 'Open security incidents by assignment group', 'sn_si_incident', 'active=true', 'assignment_group', { span: 8, top: 7 }))
    add(sect('CMDB health and integrity'))
    add(stat(d.cis_updated_30d, 3) + stat(d.orphan_cis, 3) + stat(d.ci_relationships, 3))
    await addAll(bd('vbars', 'CIs updated in last 30 days, by class', 'cmdb_ci', 'sys_updated_on>=javascript:gs.daysAgoStart(30)', 'sys_class_name', { span: 6, top: 6 }), bd('lolli', 'CIs by location', 'cmdb_ci', 'locationISNOTEMPTY', 'location', { span: 6, top: 9 }))
    add(sect('Application portfolio'))
    await addAll(bd('vbars', 'Business applications by lifecycle stage', 'cmdb_ci_business_app', 'active=true^life_cycle_stageISNOTEMPTY', 'life_cycle_stage', { span: 6, top: 6 }), bd('donut', 'Business applications by criticality', 'cmdb_ci_business_app', '', 'business_criticality', { span: 6, top: 5 }))
    add(sect('CIO view', 'Warranty exposure, and the server capacity fields the current dashboard labels "utilization".'))
    add(stat(d.warranty_expired, 3, { warn: 20, bad: 60 }) + stat(d.warranty_90d, 3) + stat(d.servers_no_warranty, 3))
    await addAll(breakdown('Servers by installed memory (MB), static capacity', 'cmdb_ci_server', 'ramISNOTEMPTY', 'ram', { top: 8 }), breakdown('Servers by CPU count, static capacity', 'cmdb_ci_server', 'cpu_countISNOTEMPTY', 'cpu_count', { top: 8 }))
    const svc = id_('svc'); if (svc) svc.onchange = () => { location.hash = 'estate&service=' + svc.value }
  }
  if (page === 'knowledge') {
    add(stat(d.kb_uses, 3) + stat(d.csat_responses, 3) + stat(d.reopened, 3))
    add(sect('Knowledge'))
    await addAll(bd('donut', 'Published articles by knowledge base', 'kb_knowledge', 'workflow_state=published', 'kb_knowledge_base', { span: 5, top: 5 }), bd('lolli', 'Article uses by knowledge base', 'kb_use', '', 'article.kb_knowledge_base', { span: 7, top: 8 }))
  }

  const off = rows.filter((r) => r.status !== 'available' && r.status !== 'derived')
  id_('foot').innerHTML = `Every number can show how it is measured (the ? on each card) and opens the exact records in ServiceNow.${off.length ? `<div class="offl"><span style="border:0;background:none;padding-left:0">Not on this instance:</span>${off.map((r) => `<span title="${esc(r.reason)}">${esc(r.name)} · ${esc(r.status)}</span>`).join('')}</div>` : ''}`
  document.querySelectorAll('.t-def').forEach((b) => b.onclick = (e) => {
    e.preventDefault(); const card = b.closest('.card'), was = card.classList.contains('open')
    document.querySelectorAll('.card.open').forEach((c) => { c.classList.remove('open'); c.querySelector('.t-def')?.classList.remove('on') })
    if (!was) { card.classList.add('open'); b.classList.add('on') }
  })
  document.addEventListener('click', (e) => { if (!e.target.closest('.card.open')) document.querySelectorAll('.card.open').forEach((c) => { c.classList.remove('open'); c.querySelector('.t-def')?.classList.remove('on') }) }, { once: false })
  document.querySelectorAll('.t-tbl').forEach((b) => b.onclick = (e) => { e.preventDefault(); b.classList.toggle('on'); b.closest('.card').classList.toggle('tbl') })
  document.querySelectorAll('[data-tip]').forEach((m) => { m.addEventListener('mousemove', (e) => showTip(e, m.dataset.tip)); m.addEventListener('mouseleave', hideTip) })
  // Entrance order: cards rise in the order they appear; figures count up; the tab line slides over.
  document.querySelectorAll('#page .card').forEach((c, i) => c.style.setProperty('--i', i))
  // Table rows step in one after another; the delay is capped so long lists do not trail.
  document.querySelectorAll('#page .tbl').forEach((t) => t.querySelectorAll('tr').forEach((tr, r) => tr.style.setProperty('--r', Math.min(r, 12))))
  document.querySelectorAll('#page [data-count]').forEach((n) => countUp(n))
  document.querySelectorAll('#page [data-count-pct]').forEach((n) => countUpPct(n))
  requestAnimationFrame(placeInd)
  firstPaint = false
}
// Every page change starts at the top, never where the last page was scrolled to. This also undoes
// the browser's own jump to the element whose id matches the hash (#resolve is one).
addEventListener('hashchange', () => { firstPaint = true; scrollTo({ top: 0, left: 0, behavior: 'instant' }) })

// ---- Ask NowOps: one conversation store, two frames. The drawer answers a quick question
// beside the dashboard; the full session adds saved history. Both post to the same /api/chat.
const chat = id_('chat'), clog = id_('clog'), cq = id_('cq'), csend = id_('csend'), csugg = id_('csugg')
const fs = id_('fs'), fslog = id_('fslog'), fsq = id_('fsq'), fswelc = id_('fswelc'), fshist = id_('fshist'), fsbody = id_('fsbody')
const fssend = id_('fssend'), fschips = id_('fschips'), fshint = id_('fshint'), fssugg = id_('fssugg')
const USER = { name: 'Mayur', org: 'Acme (demo tenant)' }
const CAPS = [
  { ic: 'sigma', title: 'Count anything on the instance', ex: ['How many open incidents?', 'How many SLA breaches?', 'How many open changes?'] },
  { ic: 'doc', title: 'Find how-to from the knowledge base', ex: ['How do I reset a password?', 'How do I request a laptop?', 'How do I connect to VPN?'] },
]
const QUICK = [['sigma', 'How many open incidents?'], ['doc', 'How do I reset a password?'], ['sigma', 'How many SLA breaches?']]
const TRY = ['How many open P1 incidents?', 'How do I reset my password?', 'How many changes are open right now?', 'How do I request access to SAP?', 'How many SLA breaches this month?', 'How do I connect to VPN?']
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
const tw = id_('fstw'), twt = id_('fstwt')
const REASON = {
  too_few_tokens: ['A word or two is not enough to search on. Ask a full question.', 'soft'],
  servicenow_unavailable: ['The ServiceNow instance did not answer. Live counts and articles both need it.', 'off'],
  metric_unavailable: ['The count was attempted, but the instance rejected the query.', 'off'],
  model_declined: ['No published article covers this, so there is no grounded answer to give.', 'soft'],
}
const GREETING = 'Ask for a live count on this instance, or how to do something from the knowledge base.'
const KEY = 'nowops.chats.v2', HIST_SHOWN = 10

let convos = []
try { convos = JSON.parse(localStorage.getItem(KEY) || '[]') } catch { convos = [] }
let active = null, showAll = false, filterText = ''
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(convos.slice(0, 50))) } catch {} }
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s
const initials = (n) => n.split(/[\s._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?'
const dayGreeting = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening' }
const kindOf = (d) => d?.kind === 'metric' ? 'live count' : d?.kind === 'article' ? 'knowledge base' : d?.kind === 'local' ? 'from this page' : 'no answer'
const kindIcon = (c) => { const k = c.turns.find((t) => t.role === 'bot' && t.data)?.data.kind; return icon(k === 'metric' ? 'sigma' : k === 'article' ? 'doc' : 'flat') }
const replay = (n) => { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '' }
function newChat() { active = { id: crypto.randomUUID(), title: '', at: Date.now(), turns: [] }; paint(); animateGreeting() }

const note = (tone, titleHtml, why, tries = []) => `<div class="ans note ${tone}"><i>${tone === 'off' ? '!' : '?'}</i><div><div>${titleHtml}</div><div class="why">${esc(why)}</div>${tries.length ? `<div class="try">${tries.map((x) => `<button type="button" data-ask="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}</div></div>`
const reveal = (s, on) => { if (!on) return esc(s); let n = 0; return String(s ?? '').split(/(\s+)/).map((w) => /\S/.test(w) && n < 120 ? `<span class="w" style="animation-delay:${n++ * 14}ms">${esc(w)}</span>` : esc(w)).join('') + '<span class="caret"></span>' }
const kindBadge = (k) => k === 'metric' ? `<div class="kindb">${icon('sigma')}Live count</div>` : k === 'article' ? `<div class="kindb">${icon('doc')}Knowledge base</div>` : k === 'local' ? `<div class="kindb" style="color:var(--ai-ink);background:var(--ai-bg)">${icon('inbox')}Resolve</div>` : ''
function countUp(n) {
  const end = Number(n.dataset.count); if (!isFinite(end)) return
  if (REDUCED) { n.textContent = end.toLocaleString('en-US'); return }
  const t0 = performance.now(), dur = 1300
  const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - (1 - p) ** 3; n.textContent = Math.round(end * e).toLocaleString('en-US'); if (p < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}
function replyHtml(t, fresh = false) {
  if (t.pending) return '<span class="think"><span class="dots"><i></i><i></i><i></i></span><b>Searching the knowledge base and this instance</b></span>'
  if (t.failed) return note('off', 'Request failed', 'The chat service did not respond. Is the server still running?')
  const d = t.data ?? {}
  if (d.kind === 'metric' && d.metric) {
    const m = d.metric
    const v = typeof m.value === 'number' ? `<span data-count="${m.value}">${fresh ? '0' : m.value.toLocaleString('en-US')}</span>` : esc(String(m.value))
    return `<div class="ans metric">${kindBadge('metric')}<div class="num">${v}${m.label ? `<small>${esc(m.label)}</small>` : ''}</div><div class="meta"><span class="pillm">${esc(m.table)}</span><span class="pillm">${esc(m.aggregate)}${m.field ? `(${esc(m.field)})` : ''}</span></div><div class="q"><b>Query</b>${esc(m.filter || '(no filter, whole table)')}</div><a class="go" href="${esc(m.url)}" target="_blank" rel="noopener">Verify in ServiceNow ${icon('link')}</a></div>`
  }
  if (d.kind === 'article') {
    const srcs = (d.sources || []).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${icon('doc')}${esc(s.label || s.title)}</a>`).join('')
    return `<div class="ans article">${kindBadge('article')}<div>${reveal(d.answer, fresh)}</div>${srcs ? `<div class="srcs">Sources${srcs}</div>` : ''}</div>`
  }
  // Answered from records already on the Resolve page: no model call, nothing fetched.
  if (d.kind === 'local') return `<div class="ans">${kindBadge('local')}<div>${d.html}</div></div>`
  const [why, tone] = REASON[d.gateReason] ?? ['No response.', 'soft']
  return note(tone, reveal(d.answer ?? d.error ?? 'No answer', fresh), why, tone === 'soft' ? CAPS.map((c) => c.ex[0]) : [])
}
function drawerEmpty() {
  const recent = convos.filter((c) => c.turns.length && c !== active).slice(0, 2)
  // On a Resolve page the welcome speaks about what is on screen and offers actions on it.
  const ctx = ctxChips(), c = R.cur, q = R.queue
  const gaps = c ? (c.checks || []).filter((x) => !x.ok).length : 0
  const head = R.view === 'ticket' && c
    ? `<b>${esc(c.number)}</b><span>${esc(clip(c.title, 70))}. ${gaps ? `Ticket check has ${gaps} line${gaps === 1 ? '' : 's'} to fix.` : 'The record is complete.'} ${c.similar.length ? `${c.similar.length} resolved ticket${c.similar.length === 1 ? '' : 's'} read the same way.` : 'No resolved ticket on this instance matches.'}</span>`
    : R.view === 'queue' && q
      ? `<b>${esc(dayGreeting())}, ${esc(q.me.name.split(' ')[0])}.</b><span>${q.queue.length} ticket${q.queue.length === 1 ? '' : 's'} ranked for you. Ask about the queue, or anything on the instance.</span>`
      : `<b>${esc(dayGreeting())}, ${esc(USER.name)}.</b><span>${GREETING}</span>`
  const qa = ctx ? ctx.map(([ic, l, a]) => `<button type="button" data-act="${esc(a)}">${icon(ic)}${esc(l)}</button>`).join('') : QUICK.map(([ic, q]) => `<button type="button" data-ask="${esc(q)}">${icon(ic)}${esc(q)}</button>`).join('')
  return `<div class="dwelc">${head}<div class="qa">${qa}</div>${recent.length ? `<div class="rc"><div class="h">Recent<button type="button" data-full>Open full session ${icon('ext')}</button></div>${recent.map((c) => `<a data-id="${c.id}">${kindIcon(c)}<span>${esc(c.title)}</span></a>`).join('')}</div>` : ''}</div>`
}
const plainText = (t) => t.data?.answer ?? ''
const stamp = (t) => `${new Date(t.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · ${(t.ms / 1000).toFixed(1)}s · ${kindOf(t.data)}`
const actions = (t, i, last) => t.pending || t.failed ? '' : `<div class="acts"><button type="button" data-copy="${esc(plainText(t))}" title="Copy">${icon('copy')}</button><button type="button" data-vote="up" data-i="${i}" class="${t.vote === 'up' ? 'on' : ''}" title="Good answer">${icon('tup')}</button><button type="button" data-vote="down" data-i="${i}" class="dn ${t.vote === 'down' ? 'on' : ''}" title="Poor answer">${icon('tdn')}</button>${last ? `<button type="button" data-redo title="Ask again">${icon('redo')}</button>` : ''}<span class="when">${stamp(t)}</span></div>`

function paint() {
  const turns = active?.turns ?? []
  clog.innerHTML = turns.length ? '' : drawerEmpty()
  fslog.innerHTML = ''
  turns.forEach((t, i) => {
    const fresh = !t.shown && !t.pending; if (fresh) t.shown = true
    const cls = fresh ? ' in' : ''
    if (t.role === 'user') { const h = `<div class="m user${cls}">${esc(t.text)}</div>`; clog.insertAdjacentHTML('beforeend', h); fslog.insertAdjacentHTML('beforeend', h); return }
    const h = `<div class="m bot${cls}">${replyHtml(t, fresh)}${actions(t, i, i === turns.length - 1)}</div>`
    clog.insertAdjacentHTML('beforeend', h); fslog.insertAdjacentHTML('beforeend', h)
  })
  for (const n of document.querySelectorAll('#clog .in [data-count], #fslog .in [data-count]')) countUp(n)
  fslog.hidden = turns.length === 0
  fsbody.classList.toggle('nos', turns.length === 0)
  fswelc.hidden = fschips.hidden = turns.length > 0
  fshint.hidden = turns.length === 0
  clog.scrollTop = clog.scrollHeight; fsbody.scrollTop = fsbody.scrollHeight
  paintHistory()
}
function paintHistory() {
  const saved = convos.filter((c) => c.turns.length && (!filterText || c.title.toLowerCase().includes(filterText)))
  const shown = showAll ? saved : saved.slice(0, HIST_SHOWN)
  const day = 864e5, start = new Date().setHours(0, 0, 0, 0)
  const bucket = (t) => t >= start ? 'Today' : t >= start - day ? 'Yesterday' : t >= start - 7 * day ? 'Last 7 days' : 'Older'
  let last = null, html = ''
  for (const c of shown) {
    const b = bucket(c.at); if (b !== last) { html += `<div class="grp">${b}</div>`; last = b }
    html += `<a data-id="${c.id}" class="${active && c.id === active.id ? 'on' : ''}" title="${esc(c.title)}"><span>${esc(c.title || 'Untitled')}</span><button type="button" class="x" data-del="${c.id}" title="Delete this chat" aria-label="Delete this chat">${icon('trash')}</button></a>`
  }
  fshist.innerHTML = html || `<div class="grp">Chats</div><div class="empty">${filterText ? 'No chat matches that.' : 'Nothing saved yet. Your chats will appear here.'}</div>`
  const all = id_('fsall'); all.hidden = saved.length <= HIST_SHOWN; all.textContent = showAll ? 'Show fewer' : `View all chats (${saved.length})`
}
async function ask(message) {
  if (!active) newChat()
  if (!convos.some((c) => c.id === active.id)) convos.unshift(active)
  if (!active.title) active.title = clip(message, 44)
  active.at = Date.now()
  active.turns.push({ role: 'user', text: message, shown: false })
  const turn = { role: 'bot', pending: true }
  active.turns.push(turn); paint()
  const t0 = performance.now()
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message, conversationId: active.id }) })
    turn.data = await r.json()
  } catch { turn.failed = true }
  turn.pending = false; turn.at = Date.now(); turn.ms = performance.now() - t0
  save(); paint()
}
function animateGreeting() {
  const hi = id_('fshi'); hi.textContent = `${dayGreeting()}, ${USER.name}.`; replay(hi)
  const words = 'What can I help you with?'.split(' ')
  id_('fsgreet').innerHTML = words.map((w, i) => `<i style="animation-delay:${160 + i * 60}ms">${esc(w)}</i>`).join(' ')
  const sub = id_('fssub'); replay(sub); sub.style.animationDelay = `${160 + words.length * 60 + 80}ms`
}
async function loadWho() {
  const me = await api('/api/me').catch(() => null)
  const name = me?.name || (me?.user ? me.user.split('@')[0] : USER.name)
  USER.name = name; id_('fsname').textContent = name; id_('fsorg').textContent = me?.tenant || USER.org; id_('fsav').textContent = initials(name)
  const tav = id_('topav'); if (tav) { tav.textContent = initials(name); tav.title = `${name} · ${me?.tenant || USER.org}` }
}
async function loadMode() {
  const [h, c] = await Promise.all([api('/api/health').catch(() => null), api('/api/connection').catch(() => null)])
  const stub = h?.llmMode === 'stub', up = !!h?.servicenow?.ok
  let host = 'instance'; try { host = new URL(c.instance_url).hostname.split('.')[0] } catch {}
  id_('insthost').textContent = host; id_('instchip').title = h?.servicenow?.detail ?? ''
  id_('livechip').classList.toggle('off', !up); id_('when').textContent = up ? id_('when').textContent : 'Instance offline'
  const inst = id_('fsinst'); inst.innerHTML = `<span class="dot"></span><span>${esc(host)}${up ? '' : ' · offline'}</span>`; inst.className = `chip${up ? '' : ' off'}`
  for (const m of [id_('cmode'), id_('fsmode')]) { m.textContent = stub ? 'Stub mode' : (h?.model ?? 'Live'); m.className = `pill ${stub ? 'warn' : 'up'}`; m.title = stub ? 'Canned answers over live data' : 'Live model' }
}

const showFull = (on) => { fs.hidden = !on; document.body.style.overflow = on ? 'hidden' : ''; document.body.classList.toggle('fsopen', on) }
function openDrawer() { showFull(false); chat.hidden = false; document.body.classList.add('drawer'); if (!active) newChat(); paint(); cq.focus() }
const closeDrawer = () => { chat.hidden = true; document.body.classList.remove('drawer') }
// The dock at the foot of every page: type a question and it opens the full session already answering.
id_('dock').onsubmit = (e) => { e.preventDefault(); const q = id_('dockq').value.trim(); id_('dockq').value = ''; openFull(); if (q) ask(q) }
function openFull() { chat.hidden = true; document.body.classList.remove('drawer'); showFull(true); if (!active) newChat(); if (!active.turns.length) animateGreeting(); paint(); fsq.focus() }
const askFrom = (e) => { const b = e.target.closest('[data-ask]'); if (b) { fssugg.hidden = csugg.hidden = true; ask(b.dataset.ask) } }
const onLog = (e) => {
  const cp = e.target.closest('[data-copy]'); if (cp) { navigator.clipboard?.writeText(cp.dataset.copy); cp.classList.add('on'); setTimeout(() => cp.classList.remove('on'), 900); return }
  const v = e.target.closest('[data-vote]'); if (v) { const t = active.turns[Number(v.dataset.i)]; t.vote = t.vote === v.dataset.vote ? null : v.dataset.vote; save(); paint(); return }
  if (e.target.closest('[data-redo]')) { const q = [...active.turns].reverse().find((t) => t.role === 'user')?.text; if (q) ask(q); return }
  if (e.target.closest('[data-full]')) { openFull(); return }
  const row = e.target.closest('[data-id]'); if (row) { active = convos.find((c) => c.id === row.dataset.id) ?? active; paint(); return }
  const act = e.target.closest('[data-act]'); if (act) { doAct(act.dataset.act); return }
  askFrom(e)
}
clog.onclick = onLog; fslog.onclick = onLog; fschips.onclick = askFrom; fssugg.onclick = askFrom; csugg.onclick = askFrom; tw.onclick = askFrom
id_('ask').onclick = (e) => { e.preventDefault(); chat.hidden ? openDrawer() : closeDrawer() }
id_('cclose').onclick = closeDrawer
id_('cexpand').onclick = openFull
id_('fsmin').onclick = openDrawer
id_('fsclose').onclick = id_('fsback').onclick = () => showFull(false)
id_('fsnew').onclick = () => { newChat(); fsq.focus() }
id_('fsall').onclick = () => { showAll = !showAll; paintHistory() }
id_('fsfind').oninput = (e) => { filterText = e.target.value.trim().toLowerCase(); paintHistory() }
id_('fsplus').onclick = () => { fssugg.hidden = !fssugg.hidden }
id_('cplus').onclick = () => { csugg.hidden = !csugg.hidden }
id_('fstheme').onclick = () => setTheme(isDark() ? 'light' : 'dark')
document.addEventListener('click', (e) => { if (!fssugg.hidden && !e.target.closest('#fssugg,#fsplus')) fssugg.hidden = true; if (!csugg.hidden && !e.target.closest('#csugg,#cplus')) csugg.hidden = true })
fshist.onclick = (e) => {
  const del = e.target.closest('[data-del]')
  if (del) { convos = convos.filter((c) => c.id !== del.dataset.del); if (active && active.id === del.dataset.del) { save(); newChat(); return } save(); paintHistory(); return }
  const row = e.target.closest('[data-id]'); if (row) { active = convos.find((c) => c.id === row.dataset.id) ?? active; paint() }
}
const wire = (form, ta, send) => {
  form.onsubmit = (e) => { e.preventDefault(); const m = ta.value.trim(); if (!m) return; ta.value = ''; ta.style.height = 'auto'; send.disabled = true; ask(m) }
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 144) + 'px'; send.disabled = !ta.value.trim() }
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit() } }
}
wire(id_('fsform'), fsq, fssend); wire(id_('cform'), cq, csend)
const setRail = (open) => { fs.classList.toggle('norail', !open); id_('fstab').title = `${open ? 'Hide' : 'Show'} sidebar (Ctrl+B)`; try { localStorage.setItem('nowops.rail', open ? '1' : '0') } catch {} }
id_('fstab').onclick = () => setRail(fs.classList.contains('norail'))
setRail(localStorage.getItem('nowops.rail') !== '0')
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b' && !fs.hidden) { e.preventDefault(); setRail(fs.classList.contains('norail')); return }
  if (e.key !== 'Escape') return
  if (!fssugg.hidden || !csugg.hidden) fssugg.hidden = csugg.hidden = true; else if (!fs.hidden) showFull(false); else closeDrawer()
})
// "Try" line: type an example, hold, erase, next.
let twi = 0, twk = 0, twPhase = 'type', twTimer = 0
function twTick() {
  clearTimeout(twTimer)
  if (fs.hidden || fswelc.hidden) { twTimer = setTimeout(twTick, 600); return }
  const s = TRY[twi % TRY.length]; tw.dataset.ask = s; let wait = 40
  if (twPhase === 'type') { twt.textContent = s.slice(0, ++twk); wait = 28 + Math.random() * 45; if (twk >= s.length) { twPhase = 'hold'; wait = 2400 } }
  else if (twPhase === 'hold') twPhase = 'erase'
  else { twt.textContent = s.slice(0, --twk); wait = 16; if (twk <= 0) { twPhase = 'type'; twi++; wait = 350 } }
  twTimer = setTimeout(twTick, wait)
}
if (REDUCED) { twt.textContent = TRY[0]; tw.dataset.ask = TRY[0] } else twTick()
// The dock's placeholder types out the same example questions while nobody is using it.
const dockq = id_('dockq'); let dki = 0, dkk = 0, dkPhase = 'type', dkTimer = 0
function dockTick() {
  clearTimeout(dkTimer)
  if (document.activeElement === dockq || dockq.value) { dkTimer = setTimeout(dockTick, 800); return }
  const s = TRY[dki % TRY.length]; let wait = 40
  if (dkPhase === 'type') { dockq.placeholder = s.slice(0, ++dkk) + (dkk % 2 ? '|' : ''); wait = 30 + Math.random() * 40; if (dkk >= s.length) { dkPhase = 'hold'; dockq.placeholder = s; wait = 2600 } }
  else if (dkPhase === 'hold') dkPhase = 'erase'
  else { dockq.placeholder = s.slice(0, --dkk); wait = 14; if (dkk <= 0) { dkPhase = 'type'; dki++; wait = 500 } }
  dkTimer = setTimeout(dockTick, wait)
}
if (!REDUCED) dkTimer = setTimeout(dockTick, 1800)
dockq.addEventListener('blur', () => { if (!dockq.value) dockq.placeholder = 'Ask anything about this instance…' })
// Suggestion chips above the bar: one live count, one how-to, one more count. Shown for a few
// seconds after the page settles, then only while the bar is hovered or focused.
{
  const hint = id_('dockhint'), isl = id_('island')
  const picks = [['sigma', CAPS[0].ex[0]], ['doc', CAPS[1].ex[0]], ['sigma', CAPS[0].ex[1]]]
  hint.innerHTML = picks.map(([ic, q]) => `<button type="button" data-ask="${esc(q)}">${icon(ic)}${esc(q)}</button>`).join('')
  hint.onclick = (e) => { const b = e.target.closest('[data-ask]'); if (!b) return; isl.classList.remove('hello'); openFull(); ask(b.dataset.ask) }
  if (!REDUCED) { setTimeout(() => isl.classList.add('hello'), 1500); setTimeout(() => isl.classList.remove('hello'), 8500) }
}

  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return
  if (!fs.hidden || !chat.hidden) return

})
const suggHtml = CAPS.flatMap((c) => c.ex.map((x) => `<button type="button" data-ask="${esc(x)}">${esc(x)}<small>${esc(c.title)}</small></button>`)).join('')
fssugg.innerHTML = csugg.innerHTML = suggHtml
fschips.innerHTML = CAPS.flatMap((c) => c.ex.slice(0, 2)).map((x) => `<button type="button" data-ask="${esc(x)}">${esc(x)}</button>`).join('')
paintHistory(); loadMode(); loadWho(); R.ready ??= loadPeople()
// Deep links: ?chat=full opens the assistant on arrival, &ask=<question> asks it straight away.
{ const q = new URLSearchParams(location.search); if (q.get('chat') === 'full') { openFull(); const a = q.get('ask'); if (a) setTimeout(() => ask(a), 400) } }

// A mockup should fail loudly: any script error is written into the page, not lost in a console.
const fail = (e) => { (document.body.classList.contains('resolve') ? id_('resolve') : id_('page')).innerHTML = `<div class="card c12" style="color:var(--neg-ink)">Page error: ${esc(e?.message ?? e)}<pre style="white-space:pre-wrap;font-size:12px;color:var(--ink2)">${esc(e?.stack ?? '')}</pre></div>` }

const safe = (fn) => async () => { try { await fn() } catch (e) { fail(e) } }
addEventListener('hashchange', safe(render))
safe(render)()
